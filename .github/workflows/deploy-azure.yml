name: Deploy Kursiv to Azure App Service

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        run: |
          npm ci --prefix client
          npm run build --prefix client

      - name: Package app and production dependencies
        run: |
          mkdir -p deploy/client
          cp package.json deploy/package.json
          cp -R server deploy/server
          rm -rf deploy/server/node_modules deploy/server/uploads
          mkdir -p deploy/server/uploads
          cp server/uploads/demo-lesson.png deploy/server/uploads/demo-lesson.png
          cp -R client/dist deploy/client/dist
          npm ci --prefix deploy/server --omit=dev

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
